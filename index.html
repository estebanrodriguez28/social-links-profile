<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <script type="text/javascript">
      const copyClipboard = () => {
        const email = document.getElementById("email");
        navigator.clipboard.writeText("erod9246@gmail.com");
        alert("Copied email: " + "erod9246@gmail.com");
      };
    </script>
  </head>
  <body>
    <main>
      <article class="social-links-card">
        <img src="assets/images/e.jpg" alt="Picture of me" id="profile-img" />
        <h1 class="name weight-600">Esteban Rodriguez</h1>
        <h2 class="location weight-600">San Francisco, CA</h2>
        <h3 class="description weight-400">
          "Front-end developer and avid reader."
        </h3>
        <nav>
          <ul>
            <li>
              <a
                href="https://github.com/estebanrodriguez28"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub</a
              >
            </li>
            <li>
              <a
                href="https://www.frontendmentor.io/profile/estebanrodriguez28"
                target="_blank"
                rel="noopener noreferrer"

              >
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/esteban-r-e/"
                target="_blank"
                rel="noopener noreferrer"
                >LinkedIn</a
              >
            </li>
            <li>
              <a
                href="https://estebanrodriguez28.github.io/portfolio-website/"
                target="_blank"
                rel="noopener noreferrer"

              >
            </li>
            <li>
              <a

                rel="noopener noreferrer"

      <p>
